{% load static %}

<!DOCTYPE html>

<html>

<head>

    <title>
        Signup
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/output.css' %}"
    >

</head>

<body class="bg-black text-white min-h-screen flex items-center justify-center">

    <div class="bg-zinc-900 p-10 rounded-3xl border border-cyan-500 w-full max-w-md">

        <h1 class="text-4xl font-bold text-cyan-400 mb-8">

            Create Account 🚀

        </h1>

        <form method="POST" class="space-y-6">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="w-full bg-cyan-500 hover:bg-cyan-400 text-black py-3 rounded-xl font-semibold"
            >

                Signup

            </button>

        </form>

    </div>

</body>

</html>
